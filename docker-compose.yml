services:
  lorekeeper:
    build: .
    image: lorekeeper:latest
    container_name: lorekeeper
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    volumes:
      - lorekeeper-data:/app/data   # room & progres tersimpan di sini

volumes:
  lorekeeper-data:
